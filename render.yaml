# Render Blueprint — demo deployment of the backend (mock providers, synthetic samples only).
# One free web service (API + background-thread jobs). Database: external Postgres (e.g. Neon free).
# New → Blueprint → select this repo, or open:
#   https://render.com/deploy?repo=https://github.com/Jitwisut/AI-meeting
# Do NOT use for real company data (plan §3: no production data on personal hosting).

services:
  - type: web
    name: ai-meeting-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Postgres from Neon (free, persistent). Paste the connection string in the Render dashboard;
      # never commit it. Format: postgresql://USER:PASSWORD@HOST/DB?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: demo
      # jobs run in background threads inside the API container: no Redis needed
      - key: QUEUE_MODE
        value: thread
      # mock providers: anyone with the URL can use the demo, so only synthetic data
      - key: AUTH_MODE
        value: mock
      - key: GRAPH_MODE
        value: mock
      # Gemini free tier for real transcription + summary (test audio only: free-tier data may be
      # used by Google to improve its products). Set GEMINI_API_KEY in the dashboard; never commit it.
      - key: STT_PROVIDER
        value: gemini
      - key: SUMMARIZER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_STT_MODEL
        value: gemini-2.5-flash
      # allows the Vercel production URL and its preview deployments
      - key: CORS_ORIGIN_REGEX
        value: ^https://ai-meeting[a-z0-9-]*\.vercel\.app$
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_AUDIO_MINUTES
        value: "30"
      - key: TEMP_AUDIO_RETENTION_HOURS
        value: "6"

